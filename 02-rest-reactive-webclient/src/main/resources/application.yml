spring:
  application:
    name: order-rest-async-api
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  h2:
    console:
      enabled: true
      path: /h2-console
  task:
    execution:
      pool:
        core-size: 10
        max-size: 20
        queue-capacity: 100
    scheduling:
      pool:
        size: 5

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.apiarchlab: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web.client: DEBUG

# External service URLs (for WebClient calls)
external:
  services:
    payment-service:
      url: http://localhost:9090
      timeout: 5000ms
    notification-service:
      url: http://localhost:9091
      timeout: 3000ms
    inventory-service:
      url: http://localhost:9092
      timeout: 5000ms

